name: Testes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testar:
    runs-on: ubuntu-latest


    steps:

      - name: checkout
        uses: actions/checkout@v4

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: build
        run: dotnet build src/UnitTestingTutorial.slnx
        
      - name: testes-unitarios
        run: dotnet test src/UnitTestingTutorial.slnx